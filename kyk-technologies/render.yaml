# Canonical Render configuration for kyk-technologies subfolder deployments (aligned with root render.yaml)
services:
  - type: web
    name: kyktechnologies
    branch: main
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gthread --workers 4 --threads 25 --worker-connections 1000 --backlog 2048 --timeout 120 --max-requests 5000 --max-requests-jitter 500 --access-logfile - --error-logfile - app:app
    healthCheckPath: /api/health/database
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: COMPANY_TIMEZONE
        value: Asia/Kolkata