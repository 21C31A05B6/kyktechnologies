<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KYK Content Manager Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="/css/style.css"/>
<link rel="stylesheet" href="/css/dashboard.css"/>
</head>
<body class="admin-page">
<!-- Dashboard shell (hidden until logged in) -->
<div class="admin-shell" id="dashShell" style="display:none;">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="/index.html" class="logo" aria-label="KYK home"><img src="/kyk_logo.webp" alt="KYK Technologies" style="width:38px;height:38px;object-fit:contain;display:block;"/></a>
      <div class="role-badge" id="roleLabel">Loading…</div>
    </div>
    <nav id="sidebarNav"><!-- tabs rendered by JS based on role --></nav>
    <div class="sidebar-footer">
      <div class="admin-name" id="adminName"></div>
      <div style="font-size:.74rem;color:var(--steel);" id="adminEmail"></div>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <!-- Overview -->
    <div class="panel active" id="panel-overview">
      <h2 style="font-family:var(--font-display);margin-bottom:20px;">Content Overview</h2>
      <div class="stat-cards" id="statCards"></div>
      <div class="chart-card" style="margin-bottom:24px;">
        <b style="font-family:var(--font-display);font-size:.9rem;">Applications — last 14 days</b>
        <canvas id="appsChart" height="180" style="margin-top:14px;width:100%;display:block;"></canvas>
      </div>
    </div>

    <!-- Insights -->
    <div class="panel" id="panel-insights">
      <details style="margin-bottom:20px;" id="insightDetails">
        <summary class="btn btn-primary" style="display:inline-flex;cursor:pointer;" id="insightFormToggle">+ New article</summary>
        <form id="insightForm" class="form-card" style="margin-top:16px;max-width:700px;">
          <input type="hidden" id="insightEditId"/>
          <div class="field"><label>Title *</label><input id="insightTitle" required/></div>
          <div class="job-form-grid">
            <div class="field"><label>Category *</label>
              <select id="insightCategory">
                <option>AI</option><option>Global Recruitment</option>
                <option>Software &amp; Web Services</option><option>Technology</option><option>Company</option>
              </select>
            </div>
            <div class="field" style="display:flex;align-items:center;gap:8px;padding-top:20px;">
              <input type="checkbox" id="insightPublished" checked style="width:16px;height:16px;accent-color:var(--orange);"/>
              <label for="insightPublished" style="margin:0;font-weight:500;">Published</label>
            </div>
          </div>
          <div class="field"><label>Summary</label><textarea id="insightSummary" rows="3"></textarea></div>
          <div class="field"><label>Article body</label><textarea id="insightBody" rows="10" style="font-family:monospace;font-size:.82rem;"></textarea></div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" type="submit" id="insightSubmitBtn">Publish</button>
            <button class="btn btn-outline" type="button" id="insightCancelEdit" style="display:none;">Cancel</button>
          </div>
          <div class="form-msg" id="insightMsg"></div>
        </form>
      </details>
      <table><thead><tr><th>Title</th><th>Category</th><th>Status</th><th></th></tr></thead>
      <tbody id="insightsBody"></tbody></table>
    </div>

    <!-- My Attendance -->
    <div class="panel" id="panel-my_attendance">
      <h3 style="font-family:var(--font-display);margin-bottom:16px;">My Attendance</h3>
      <div class="punch-card form-card glass-glow">
        <div class="punch-status" id="punchStatusLabel">Loading…</div>
        <div class="punch-time" id="punchTimeLabel">—</div>
        <button class="btn btn-primary" id="checkInBtn">Check in</button>
        <button class="btn btn-outline" id="checkOutBtn" style="display:none;">Check out</button>
        <div class="form-msg" id="punchMsg"></div>
      </div>
      <div class="month-nav">
        <button class="small-btn" id="myCalPrev">← Prev</button>
        <b id="myCalLabel">—</b>
        <button class="small-btn" id="myCalNext">Next →</button>
      </div>
      <div class="stat-cards" id="myCalSummary"></div>
      <table><thead><tr><th>Date</th><th>Check in</th><th>Check out</th><th>Hours worked</th><th>Status</th></tr></thead>
      <tbody id="myCalBody"></tbody></table>
    </div>
  </main>
</div>

<script src="/js/main.js" defer></script>
<script src="/js/dash-common.js"></script>
</body>
</html>
