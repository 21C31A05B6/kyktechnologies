<!DOCTYPE html>

<head>

<title>KYK Technologies — Login</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23E8622C%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22>K</text></svg>"/>
<link rel="apple-touch-icon" href="/kyk_logo.webp"/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
<link rel="preload" href="/kyk_video.mp4" as="video" type="video/mp4" />
<link rel="stylesheet" href="/css/style.css?v=20261026-cursor-v8"/>
<link rel="stylesheet" href="/css/dashboard.css?v=20261026-cursor-v8"/>
</head>
<body class="admin-page login-page" data-auth-mode="login" data-admin-login="0">
<div id="loginScreen">
  <div class="login-card form-card">
    <div class="login-brand">
      <a href="/index.html" class="logo" aria-label="KYK home"><img src="/kyk_logo.webp" alt="KYK Technologies" /></a>
      <p>Key to Your Kognitio</p>
    </div>

    <div class="auth-toggle" role="tablist" aria-label="Account access">
      <button type="button" class="auth-tab active" data-auth-mode="login" role="tab" aria-selected="true" aria-controls="loginPanel">Login</button>
      <button type="button" class="auth-tab" data-auth-mode="signup" role="tab" aria-selected="false" aria-controls="signupPanel">Signup</button>
    </div>

    <div class="auth-panel active" id="loginPanel" role="tabpanel">
      <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required/></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required/></div>
      <button class="btn btn-primary btn-block" id="loginBtn" type="button">Login</button>
      <div class="form-msg" id="loginMsg"></div>
    </div>

    <div class="auth-panel" id="signupPanel" role="tabpanel">
      <div class="field"><label for="signupName">Full name</label><input id="signupName" type="text" autocomplete="name" required/></div>
      <div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" required/></div>
      <div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" autocomplete="new-password" required/></div>
      <button class="btn btn-primary btn-block" id="signupBtn" type="button">Create account</button>
      <div class="form-msg" id="signupMsg"></div>
    </div>
  </div>
</div>

<script src="/js/dash-common.js?v=20261026-cursor-v8" defer></script>
<script src="/js/main.js?v=20261026-cursor-v8" defer></script>
<script src="/js/login.js?v=20261001-login-1" defer></script>
</body>
</html>
