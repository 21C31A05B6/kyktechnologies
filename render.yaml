services:
  - type: web
    name: kyktechnologies
    rootDir: kyk-technologies
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gthread --workers 4 --threads 4 --timeout 120 --access-logfile - --error-logfile - app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: COMPANY_TIMEZONE
        value: Asia/Kolkata
